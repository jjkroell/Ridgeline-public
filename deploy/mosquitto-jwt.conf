# Authenticated observer broker (reached at your own hostname -> localhost:9102).
#
# This runs ALONGSIDE the anonymous broker in mosquitto.conf, which is left
# untouched so existing observers keep publishing while they are migrated across
# one at a time. Both brokers feed the same ridgelined via separate ingest
# clients (config.json extraBrokers).
#
# Every auth decision is delegated to ridgelined over the compose network:
# observers present an Ed25519 token signed by their own node key, which only
# ridgelined knows how to verify (the format is not a standards-compliant JWT).

# Internal plain MQTT for ridgelined's ingest client (compose network only).
listener 1883 0.0.0.0

# External WebSocket for observer nodes via the Cloudflare Tunnel.
listener 9001 0.0.0.0
protocol websockets

# No anonymous access here — that is the entire point of this broker. Note that
# loading an auth plugin makes this the default anyway; it is stated explicitly
# so the intent survives someone reading only this file.
allow_anonymous false

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_log_level info

# ridgelined serves the checks. http_host takes an address and skips DNS, but
# the compose service name resolves fine on the project network.
auth_opt_http_host ridgelined
auth_opt_http_port 8080
auth_opt_http_getuser_uri /api/mqtt-auth/user
auth_opt_http_superuser_uri /api/mqtt-auth/superuser
auth_opt_http_aclcheck_uri /api/mqtt-auth/acl
auth_opt_http_response_mode json
auth_opt_http_params_mode json
auth_opt_http_method POST
auth_opt_http_timeout 5

# Do not cache auth decisions. The ACL check is what binds an observer to its
# own topic subtree, and a stale allow is a spoofing window.
auth_opt_cache false

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type information
# Client connect/disconnect is logged at notice level. Without it the broker
# looks silent while a misconfigured observer retries, and the only trace is
# whatever ridgelined happens to log -- which is how a rejected client was
# mistaken for one that never arrived. Worth the noise while observers migrate.
log_type notice
